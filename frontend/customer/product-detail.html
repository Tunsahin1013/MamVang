<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Món Ăn - Mâm Vàng</title>
  <link rel="stylesheet" href="/canteen-management/frontend/css/style.css">
</head>
<body>

  <header class="customer-nav">
    <div class="container nav-container">
      <a href="/canteen-management/frontend/customer/home.html" class="flex items-center gap-2" style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">
        <span style="font-size: 1.7rem;">🍜</span> Mâm Vàng
      </a>
      <div class="flex items-center gap-3">
        <a href="/canteen-management/frontend/customer/cart.html" class="btn btn-primary btn-sm" style="position: relative;">
          🛒 Giỏ Hàng <span class="badge cart-count-badge" style="position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 9999px;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <div style="margin-bottom: 1.5rem;">
      <a href="/canteen-management/frontend/customer/products.html" style="color: var(--primary); font-weight: 600; font-size: 0.9rem;">← Quay lại danh sách thực đơn</a>
    </div>

    <div id="product-container" class="grid grid-cols-2 gap-6 card" style="padding: 2.5rem; margin-bottom: 2.5rem;">
      <!-- Loaded dynamically -->
      <div style="text-align: center; padding: 2rem;">Đang tải thông tin món ăn...</div>
    </div>

    <!-- Reviews Section -->
    <div class="card" style="padding: 2rem;">
      <div class="flex justify-between items-center" style="margin-bottom: 1.5rem;">
        <h3 style="font-size: 1.35rem; font-weight: 800;">Đánh Giá Từ Sinh Viên</h3>
        <span id="reviews-header-count" class="badge badge-confirmed">0 Đánh giá</span>
      </div>

      <div id="reviews-list" class="flex" style="flex-direction: column; gap: 1rem;">
        <!-- Injected by JS -->
      </div>
    </div>
  </main>

  <script src="/canteen-management/frontend/js/api.js"></script>
  <script src="/canteen-management/frontend/js/auth.js"></script>
  <script>
    let currentProduct = null;
    let qty = 1;

    async function initDetail() {
      AuthGuard.checkAccess();

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        window.location.href = '/canteen-management/frontend/customer/products.html';
        return;
      }

      try {
        const res = await API.get('/products/get.php', { id });
        if (res.success && res.data) {
          currentProduct = res.data;
          renderDetail(currentProduct);
        } else {
          showToast(res.message || 'Không tìm thấy món ăn', 'error');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderDetail(p) {
      const formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price);

      const container = document.getElementById('product-container');
      container.innerHTML = `
        <!-- Image Column -->
        <div>
          <img src="${p.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'}" style="width: 100%; height: 380px; object-fit: cover; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
        </div>

        <!-- Details Column -->
        <div class="flex" style="flex-direction: column; justify-content: center;">
          <span class="badge badge-ready" style="width: fit-content; margin-bottom: 0.5rem;">${p.category_name}</span>
          <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">${p.name}</h1>
          <div class="flex items-center gap-2" style="margin-bottom: 1rem; font-size: 0.95rem;">
            <span style="color: #f59e0b; font-weight: 700;">⭐ ${p.avg_rating} / 5.0</span>
            <span style="color: var(--text-muted);">(${p.review_count} lượt đánh giá)</span>
            <span style="color: var(--text-muted); margin-left: 0.5rem;">• Tồn kho: <strong>${p.stock_quantity}</strong> phần</span>
          </div>

          <div style="font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 1.25rem;">
            ${formattedPrice}
          </div>

          <p style="color: var(--text-muted); line-height: 1.7; margin-bottom: 1.75rem;">
            ${p.description || 'Món ăn căn tin chất lượng, hương vị thơm ngon và giàu năng lượng cho ngày học tập làm việc.'}
          </p>

          <!-- Notes input -->
          <div class="form-group">
            <label class="form-label" for="order-notes">Ghi chú cho bếp (Tùy chọn):</label>
            <input type="text" id="order-notes" class="form-control" placeholder="VD: Không cay, ít đá, nhiều ớt rim...">
          </div>

          <!-- Quantity and Action Button -->
          <div class="flex items-center gap-4" style="margin-top: 0.5rem;">
            <div class="flex items-center" style="border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden;">
              <button class="btn btn-secondary btn-sm" onclick="changeQty(-1)" style="border-radius: 0; padding: 0.6rem 1rem;">-</button>
              <span id="qty-val" style="padding: 0 1.2rem; font-weight: 700;">1</span>
              <button class="btn btn-secondary btn-sm" onclick="changeQty(1)" style="border-radius: 0; padding: 0.6rem 1rem;">+</button>
            </div>

            <button class="btn btn-primary btn-lg flex items-center gap-2" style="flex-grow: 1;" ${p.stock_quantity <= 0 ? 'disabled' : ''} onclick="addToCart()">
              🛒 Thêm Vào Giỏ Hàng
            </button>
          </div>
        </div>
      `;

      // Render reviews
      const reviewsList = document.getElementById('reviews-list');
      const countBadge = document.getElementById('reviews-header-count');
      const reviews = p.reviews || [];

      countBadge.textContent = `${reviews.length} Đánh giá`;

      if (reviews.length === 0) {
        reviewsList.innerHTML = `<p style="color: var(--text-muted); font-style: italic;">Chưa có đánh giá nào cho món ăn này. Hãy đặt và trở thành người đầu tiên đánh giá!</p>`;
        return;
      }

      reviewsList.innerHTML = '';
      reviews.forEach(r => {
        const item = document.createElement('div');
        item.style.padding = '1rem';
        item.style.background = 'var(--bg-main)';
        item.style.borderRadius = 'var(--radius-md)';
        item.innerHTML = `
          <div class="flex justify-between items-center" style="margin-bottom: 0.4rem;">
            <div class="flex items-center gap-2">
              <img src="${r.user_avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'}" style="width: 28px; height: 28px; border-radius: 50%;">
              <strong>${r.user_name}</strong>
            </div>
            <span style="color: #f59e0b; font-weight: 700;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
          </div>
          <p style="font-size: 0.9rem; color: var(--text-main);">${r.comment || 'Món ăn ngon và sạch sẽ.'}</p>
        `;
        reviewsList.appendChild(item);
      });
    }

    function changeQty(diff) {
      if (!currentProduct) return;
      qty = Math.max(1, Math.min(currentProduct.stock_quantity || 99, qty + diff));
      document.getElementById('qty-val').textContent = qty;
    }

    function addToCart() {
      if (!currentProduct) return;
      const notes = document.getElementById('order-notes').value.trim();
      Cart.add(currentProduct, qty, notes);
    }

    document.addEventListener('DOMContentLoaded', initDetail);
  </script>
</body>
</html>
