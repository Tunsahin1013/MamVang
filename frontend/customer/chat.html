<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỗ Trợ Trực Tuyến - Mâm Vàng</title>
  <link rel="stylesheet" href="/canteen-management/frontend/css/style.css">
  <style>
    .chat-box {
      height: 480px;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: var(--bg-main);
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    .chat-bubble {
      max-width: 70%;
      padding: 0.75rem 1.1rem;
      border-radius: 18px;
      font-size: 0.925rem;
      line-height: 1.45;
      position: relative;
    }
    .chat-bubble.mine {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .chat-bubble.other {
      align-self: flex-start;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .chat-time {
      font-size: 0.7rem;
      margin-top: 0.35rem;
      opacity: 0.8;
      display: block;
      text-align: right;
    }
  </style>
</head>
<body>

  <header class="customer-nav">
    <div class="container nav-container">
      <a href="/canteen-management/frontend/customer/home.html" class="flex items-center gap-2" style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">
        <span style="font-size: 1.7rem;">🍜</span> Mâm Vàng
      </a>
      <a href="/canteen-management/frontend/customer/home.html" class="btn btn-secondary btn-sm">🍽️ Trang Chủ</a>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem; max-width: 780px;">
    <div class="card" style="padding: 1.5rem;">
      <div class="flex items-center gap-3" style="margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.3rem;">
          👨‍🍳
        </div>
        <div>
          <strong style="font-size: 1.1rem; display: block;">Hỗ Trợ Sinh Viên Căn Tin</strong>
          <span style="font-size: 0.8rem; color: var(--success);">● Trực tuyến - Phản hồi nhanh</span>
        </div>
      </div>

      <!-- Chat Messages Container -->
      <div id="chat-messages" class="chat-box">
        <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: auto;">
          Bắt đầu cuộc trò chuyện. Bạn có thể hỏi về thực đơn hôm nay, ghi chú đơn hàng hoặc phản hồi dịch vụ.
        </div>
      </div>

      <!-- Message Input Form -->
      <form id="chat-send-form" class="flex gap-2">
        <input type="text" id="chat-input" class="form-control" placeholder="Nhập tin nhắn..." autocomplete="off" required>
        <button type="submit" id="btn-send" class="btn btn-primary" style="min-width: 100px;">Gửi Tin</button>
      </form>
    </div>
  </main>

  <script src="/canteen-management/frontend/js/api.js"></script>
  <script src="/canteen-management/frontend/js/auth.js"></script>
  <script>
    let activeChatId = null;
    let pollInterval = null;

    async function initChat() {
      AuthGuard.checkAccess(['CUSTOMER', 'ADMIN', 'EMPLOYEE']);

      await loadChatMessages();

      // Start polling every 4 seconds
      pollInterval = setInterval(loadChatMessages, 4000);
    }

    async function loadChatMessages() {
      try {
        const res = await API.get('/chat/messages.php', activeChatId ? { chat_id: activeChatId } : {});
        if (res.success && res.data) {
          activeChatId = res.data.chat_id;
          renderMessages(res.data.messages || []);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-messages');
      const currentUser = API.getUser();

      const shouldScroll = container.scrollTop + container.clientHeight >= container.scrollHeight - 50;

      container.innerHTML = '';
      messages.forEach(m => {
        const isMine = m.sender_role === 'CUSTOMER' || m.sender_id === currentUser?.id;
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${isMine ? 'mine' : 'other'}`;

        const timeStr = new Date(m.created_at).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

        bubble.innerHTML = `
          <div>${m.message}</div>
          <span class="chat-time">${timeStr}</span>
        `;
        container.appendChild(bubble);
      });

      if (shouldScroll || messages.length <= 3) {
        container.scrollTop = container.scrollHeight;
      }
    }

    document.getElementById('chat-send-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      const btn = document.getElementById('btn-send');
      btn.disabled = true;

      try {
        const res = await API.post('/chat/send.php', {
          chat_id: activeChatId,
          message: message
        });

        if (res.success) {
          await loadChatMessages();
        }
      } catch (err) {
        showToast(err.message || 'Lỗi gửi tin nhắn', 'error');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (pollInterval) clearInterval(pollInterval);
    });

    document.addEventListener('DOMContentLoaded', initChat);
  </script>
</body>
</html>
