<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - Canteen Management System</title>
  <link rel="stylesheet" href="/canteen-management/frontend/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(249, 115, 22, 0.05), rgba(14, 165, 233, 0.05)); padding: 2rem 1.5rem;">

  <div class="card" style="width: 100%; max-width: 480px; border-radius: 20px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 58px; height: 58px; background: var(--primary); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 1.8rem; margin-bottom: 0.75rem; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);">
        🍜
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Đăng Ký Sinh Viên</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Nhận ngay 50 điểm tích lũy & Voucher 20% khi đăng ký</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Họ và Tên</label>
        <input type="text" id="name" class="form-control" placeholder="Nguyễn Văn A" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Địa chỉ Email</label>
        <input type="email" id="email" class="form-control" placeholder="student@university.edu.vn" required>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-group">
          <label class="form-label" for="phone">Số Điện Thoại</label>
          <input type="tel" id="phone" class="form-control" placeholder="0912345678" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật Khẩu</label>
          <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="address">Địa chỉ / Khu Ký Túc Xá / Bàn Thường Ngồi</label>
        <input type="text" id="address" class="form-control" placeholder="VD: Phòng 302, KTX Khu B hoặc Khoa CNTT">
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
        Hoàn Tất Đăng Ký
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Đã có tài khoản? 
      <a href="/canteen-management/frontend/login.html" style="color: var(--primary); font-weight: 700;">Đăng nhập</a>
    </div>
  </div>

  <script src="/canteen-management/frontend/js/api.js"></script>
  <script src="/canteen-management/frontend/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Đang đăng ký...';

      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim()
      };

      try {
        const res = await API.post('/auth/register.php', payload);
        if (res.success) {
          API.setToken(res.data.token);
          API.setUser(res.data.user);
          showToast('Đăng ký tài khoản thành công! Đang chuyển hướng...', 'success');
          setTimeout(() => {
            window.location.href = res.data.redirect_url;
          }, 800);
        } else {
          showToast(res.message || 'Đăng ký thất bại', 'error');
        }
      } catch (err) {
        showToast(err.message || 'Lỗi kết nối máy chủ', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Hoàn Tất Đăng Ký';
      }
    });
  </script>
</body>
</html>
