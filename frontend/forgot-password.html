<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Lại Mật Khẩu - Canteen Management System</title>
  <link rel="stylesheet" href="/canteen-management/frontend/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(249, 115, 22, 0.05), rgba(14, 165, 233, 0.05)); padding: 1.5rem;">

  <div class="card" style="width: 100%; max-width: 440px; border-radius: 20px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 58px; height: 58px; background: var(--secondary); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 1.8rem; margin-bottom: 1rem;">
        🔑
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Quên Mật Khẩu</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Nhập email tài khoản và mật khẩu mới để thiết lập lại</p>
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Tài Khoản</label>
        <input type="email" id="email" class="form-control" placeholder="name@canteen.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="new-password">Mật Khẩu Mới</label>
        <input type="password" id="new-password" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
        Cập Nhật Mật Khẩu
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="/canteen-management/frontend/login.html" style="color: var(--primary); font-weight: 600; font-size: 0.9rem;">← Quay lại đăng nhập</a>
    </div>
  </div>

  <script src="/canteen-management/frontend/js/api.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const new_password = document.getElementById('new-password').value;

      try {
        const res = await API.post('/auth/forgot_password.php', { email, new_password });
        if (res.success) {
          showToast('Đặt lại mật khẩu thành công! Bạn có thể đăng nhập ngay.', 'success');
          setTimeout(() => window.location.href = '/canteen-management/frontend/login.html', 1200);
        } else {
          showToast(res.message, 'error');
        }
      } catch (err) {
        showToast(err.message || 'Lỗi xử lý', 'error');
      }
    });
  </script>
</body>
</html>
