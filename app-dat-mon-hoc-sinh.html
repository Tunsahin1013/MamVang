<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mâm Vàng — Đặt suất ăn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF8;
    --paper-dim:#F6EFDD;
    --ink:#2A2118;
    --ink-soft:#6b6053;
    --green:#2B4736;
    --green-deep:#1D3226;
    --mustard:#E8A93A;
    --mustard-deep:#C98C1E;
    --brick:#C1432E;
    --line:#E4D9BF;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Archivo Black',sans-serif;}

  .app{max-width:460px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; display:flex; flex-direction:column;}

  header.top{
    background:var(--green); color:var(--paper); padding:22px 20px 26px;
    border-radius:0 0 22px 22px; position:relative; overflow:hidden;
  }
  header.top::after{
    content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
    border-radius:50%; background:radial-gradient(circle, rgba(232,169,58,.35), transparent 70%);
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
  .brand{font-family:'Archivo Black',sans-serif; font-size:22px; letter-spacing:.5px;}
  .brand span{color:var(--mustard);}
  .student-chip{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); padding:6px 12px; border-radius:20px; font-size:12px;}
  .tagline{margin-top:14px; font-size:13px; color:#CFE0D3; position:relative; z-index:1;}

  .slot-bar{display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px; position:relative; z-index:1;}
  .slot-bar::-webkit-scrollbar{display:none;}
  .slot{
    flex:0 0 auto; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    border-radius:12px; padding:10px 14px; text-align:center; cursor:pointer; transition:.15s;
  }
  .slot .t{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600;}
  .slot .c{font-size:10px; margin-top:3px; color:#CFE0D3;}
  .slot.selected{background:var(--mustard); border-color:var(--mustard);}
  .slot.selected .t, .slot.selected .c{color:var(--green-deep);}
  .slot.full{opacity:.4; cursor:not-allowed;}

  .cats{display:flex; gap:8px; padding:16px 20px 4px; overflow-x:auto;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex:0 0 auto; padding:8px 14px; border-radius:20px; border:1.5px solid var(--line);
    background:var(--paper); font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .cat-btn.active{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  .menu{padding:8px 20px 120px; flex:1;}
  .item{
    display:flex; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .thumb{
    width:56px; height:56px; border-radius:12px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:26px; background:var(--paper-dim);
  }
  .item-info{flex:1; min-width:0;}
  .item-name{font-weight:700; font-size:15px;}
  .item-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .stock-low{color:var(--brick); font-weight:600;}
  .item-price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; margin-top:4px;}
  .qty-ctrl{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .qty-btn{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--ink); background:var(--paper);
    font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .qty-btn.add{background:var(--green); border-color:var(--green); color:#fff;}
  .qty-btn:disabled{opacity:.3; cursor:not-allowed;}
  .qty-num{width:16px; text-align:center; font-weight:700; font-size:14px;}
  .sold-out{opacity:.4;}
  .sold-out-tag{background:var(--brick); color:#fff; font-size:10px; padding:2px 8px; border-radius:8px; font-weight:700;}

  .cart-bar{
    position:absolute; left:16px; right:16px; bottom:16px; background:var(--ink); color:var(--paper);
    border-radius:16px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 12px 28px rgba(0,0,0,.25); cursor:pointer; transform:translateY(120%); transition:transform .25s ease;
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar .l{font-size:13px; color:#c9c2b4;}
  .cart-bar .amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px;}
  .cart-bar .go{background:var(--mustard); color:var(--green-deep); padding:9px 16px; border-radius:10px; font-weight:700; font-size:13px;}

  /* SHEET */
  .sheet-overlay{position:absolute; inset:0; background:rgba(20,16,10,.45); opacity:0; pointer-events:none; transition:.2s; z-index:20;}
  .sheet-overlay.show{opacity:1; pointer-events:all;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--paper); border-radius:22px 22px 0 0;
    padding:20px 20px 26px; transform:translateY(100%); transition:transform .28s ease; z-index:21; max-height:80%; overflow-y:auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px;}
  .sheet h3{margin:0 0 12px; font-family:'Archivo Black',sans-serif; font-size:17px;}
  .cart-line{display:flex; justify-content:space-between; padding:9px 0; font-size:14px; border-bottom:1px dashed var(--line);}
  .cart-line .nm{font-weight:600;}
  .cart-line .px{font-family:'IBM Plex Mono',monospace;}
  .total-row{display:flex; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:2px solid var(--ink); font-weight:700; font-size:16px;}
  .confirm-btn{
    width:100%; margin-top:16px; background:var(--brick); color:#fff; border:none; padding:14px; border-radius:12px;
    font-weight:700; font-size:15px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .confirm-btn:disabled{background:#ccc; cursor:not-allowed;}
  .empty-cart{text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0;}

  /* TICKET / STATUS VIEW */
  .ticket-view{position:absolute; inset:0; background:var(--green-deep); z-index:30; display:none; flex-direction:column; align-items:center; padding:40px 24px; color:var(--paper);}
  .ticket-view.show{display:flex;}
  .ticket-stub{
    background:var(--paper); color:var(--ink); border-radius:18px; padding:28px 22px; width:100%; max-width:320px;
    text-align:center; position:relative; box-shadow:0 20px 40px rgba(0,0,0,.35);
  }
  .ticket-stub::before, .ticket-stub::after{
    content:""; position:absolute; width:20px; height:20px; background:var(--green-deep); border-radius:50%; top:50%; margin-top:-10px;
  }
  .ticket-stub::before{left:-10px;} .ticket-stub::after{right:-10px;}
  .ticket-label{font-size:11px; letter-spacing:2px; color:var(--ink-soft); text-transform:uppercase;}
  .ticket-number{font-family:'Archivo Black',sans-serif; font-size:56px; color:var(--brick); margin:6px 0;}
  .ticket-slot{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; background:var(--paper-dim); display:inline-block; padding:6px 14px; border-radius:8px; margin-top:6px;}
  .dashed{border-top:2px dashed var(--line); margin:16px 0;}
  .ticket-items{text-align:left; font-size:13px;}
  .ticket-items div{display:flex; justify-content:space-between; padding:3px 0;}
  .status-steps{display:flex; justify-content:space-between; width:100%; max-width:320px; margin-top:28px;}
  .step{flex:1; text-align:center; position:relative;}
  .step .dot{width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.25); margin:0 auto 8px;}
  .step.active .dot{background:var(--mustard); box-shadow:0 0 0 5px rgba(232,169,58,.25);}
  .step .lbl{font-size:11px; color:#AFC3B4;}
  .step.active .lbl{color:var(--mustard); font-weight:700;}
  .new-order-btn{margin-top:32px; background:transparent; border:1.5px solid rgba(255,255,255,.4); color:var(--paper); padding:11px 20px; border-radius:10px; font-size:13px; cursor:pointer;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand-row">
      <div class="brand">MÂM <span>VÀNG</span></div>
      <div class="student-chip mono">HS · A19042</div>
    </div>
    <div class="tagline">Đặt trước — khỏi xếp hàng giờ cao điểm</div>
    <div class="slot-bar" id="slotBar"></div>
  </header>

  <div class="cats" id="cats"></div>
  <div class="menu" id="menu"></div>

  <div class="cart-bar" id="cartBar">
    <div>
      <div class="l">Giỏ món · <span id="cartCount">0</span> món</div>
      <div class="amt" id="cartTotal">0đ</div>
    </div>
    <div class="go">Xem giỏ →</div>
  </div>

  <div class="sheet-overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h3>Giỏ món của bạn</h3>
    <div id="sheetLines"></div>
    <div class="total-row"><span>Tổng cộng</span><span id="sheetTotal">0đ</span></div>
    <button class="confirm-btn" id="confirmBtn">Xác nhận đặt món</button>
  </div>

  <div class="ticket-view" id="ticketView">
    <div class="ticket-stub">
      <div class="ticket-label">Số thứ tự của bạn</div>
      <div class="ticket-number" id="ticketNum">A00</div>
      <div class="ticket-slot" id="ticketSlot">11:15</div>
      <div class="dashed"></div>
      <div class="ticket-items" id="ticketItems"></div>
    </div>
    <div class="status-steps">
      <div class="step active"><div class="dot"></div><div class="lbl">Đã đặt</div></div>
      <div class="step" id="stepCooking"><div class="dot"></div><div class="lbl">Đang làm</div></div>
      <div class="step" id="stepReady"><div class="dot"></div><div class="lbl">Sẵn sàng</div></div>
    </div>
    <button class="new-order-btn" id="newOrderBtn">Đặt suất khác</button>
  </div>

</div>

<script>
const CATEGORIES = [
  {id:'main', name:'Món chính'},
  {id:'drink', name:'Đồ uống'},
  {id:'snack', name:'Ăn vặt'},
];

const ITEMS = [
  {id:1, cat:'main', name:'Cơm sườn nướng', icon:'🍖', price:25000, stock:14},
  {id:2, cat:'main', name:'Bún chả', icon:'🍜', price:22000, stock:3},
  {id:3, cat:'main', name:'Cơm gà xối mỡ', icon:'🍗', price:23000, stock:0},
  {id:4, cat:'main', name:'Cơm chay', icon:'🥗', price:18000, stock:20},
  {id:5, cat:'drink', name:'Trà đào', icon:'🧋', price:12000, stock:30},
  {id:6, cat:'drink', name:'Nước cam ép', icon:'🍊', price:15000, stock:8},
  {id:7, cat:'snack', name:'Bánh tráng trộn', icon:'🌯', price:15000, stock:12},
  {id:8, cat:'snack', name:'Xúc xích chiên', icon:'🌭', price:10000, stock:5},
];

const SLOTS = [
  {t:'11:10', cap:20, used:20},
  {t:'11:15', cap:20, used:11},
  {t:'11:20', cap:20, used:6},
  {t:'11:25', cap:20, used:2},
  {t:'11:30', cap:20, used:0},
];

let cart = {};
let activeCat = 'main';
let selectedSlot = null;
let ticketSeq = 41;

function money(n){ return n.toLocaleString('vi-VN') + 'đ'; }

function renderSlots(){
  const bar = document.getElementById('slotBar');
  bar.innerHTML = '';
  SLOTS.forEach((s, i) => {
    const left = s.cap - s.used;
    const full = left <= 0;
    const div = document.createElement('div');
    div.className = 'slot' + (selectedSlot===i ? ' selected':'') + (full ? ' full':'');
    div.innerHTML = `<div class="t">${s.t}</div><div class="c">${full ? 'Đã đầy' : 'Còn '+left+' chỗ'}</div>`;
    if(!full){
      div.onclick = () => { selectedSlot = i; renderSlots(); };
    }
    bar.appendChild(div);
  });
}

function renderCats(){
  const wrap = document.getElementById('cats');
  wrap.innerHTML = '';
  CATEGORIES.forEach(c => {
    const b = document.createElement('div');
    b.className = 'cat-btn' + (activeCat===c.id ? ' active':'');
    b.textContent = c.name;
    b.onclick = () => { activeCat = c.id; renderMenu(); renderCats(); };
    wrap.appendChild(b);
  });
}

function renderMenu(){
  const wrap = document.getElementById('menu');
  wrap.innerHTML = '';
  ITEMS.filter(i => i.cat === activeCat).forEach(item => {
    const qty = cart[item.id] || 0;
    const soldOut = item.stock === 0;
    const low = item.stock > 0 && item.stock <= 5;
    const row = document.createElement('div');
    row.className = 'item' + (soldOut ? ' sold-out' : '');
    row.innerHTML = `
      <div class="thumb">${item.icon}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-meta">${soldOut ? '<span class="sold-out-tag">HẾT MÓN</span>' : (low ? `<span class="stock-low">Chỉ còn ${item.stock} suất</span>` : `Còn ${item.stock} suất`)}</div>
        <div class="item-price">${money(item.price)}</div>
      </div>
      <div class="qty-ctrl">
        ${qty>0 ? `<button class="qty-btn" data-act="minus" data-id="${item.id}">−</button><div class="qty-num">${qty}</div>` : ''}
        <button class="qty-btn add" data-act="plus" data-id="${item.id}" ${soldOut || qty>=item.stock ? 'disabled':''}>+</button>
      </div>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('.qty-btn').forEach(btn => {
    btn.onclick = () => {
      const id = +btn.dataset.id;
      if(btn.dataset.act === 'plus'){ cart[id] = (cart[id]||0) + 1; }
      else { cart[id] = Math.max(0, (cart[id]||0) - 1); if(cart[id]===0) delete cart[id]; }
      renderMenu(); renderCartBar();
    };
  });
}

function cartEntries(){
  return Object.entries(cart).map(([id, qty]) => ({item: ITEMS.find(i=>i.id==id), qty}));
}

function renderCartBar(){
  const entries = cartEntries();
  const count = entries.reduce((s,e)=>s+e.qty,0);
  const total = entries.reduce((s,e)=>s+e.qty*e.item.price,0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = money(total);
  document.getElementById('cartBar').classList.toggle('show', count>0);
}

function openSheet(){
  const entries = cartEntries();
  const lines = document.getElementById('sheetLines');
  if(entries.length===0){
    lines.innerHTML = '<div class="empty-cart">Giỏ món đang trống</div>';
  } else {
    lines.innerHTML = entries.map(e => `
      <div class="cart-line"><span class="nm">${e.item.name} ×${e.qty}</span><span class="px">${money(e.item.price*e.qty)}</span></div>
    `).join('');
  }
  const total = entries.reduce((s,e)=>s+e.qty*e.item.price,0);
  document.getElementById('sheetTotal').textContent = money(total);
  document.getElementById('confirmBtn').disabled = entries.length===0 || selectedSlot===null;
  document.getElementById('confirmBtn').textContent = selectedSlot===null ? 'Vui lòng chọn khung giờ ở trên' : 'Xác nhận đặt món';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

document.getElementById('cartBar').onclick = openSheet;
document.getElementById('overlay').onclick = closeSheet;

document.getElementById('confirmBtn').onclick = () => {
  const entries = cartEntries();
  if(entries.length===0 || selectedSlot===null) return;
  entries.forEach(e => { e.item.stock -= e.qty; });
  SLOTS[selectedSlot].used += 1;

  ticketSeq++;
  document.getElementById('ticketNum').textContent = 'A' + ticketSeq;
  document.getElementById('ticketSlot').textContent = 'Nhận lúc ' + SLOTS[selectedSlot].t;
  document.getElementById('ticketItems').innerHTML = entries.map(e =>
    `<div><span>${e.item.name} ×${e.qty}</span><span>${money(e.item.price*e.qty)}</span></div>`
  ).join('');
  document.getElementById('stepCooking').classList.remove('active');
  document.getElementById('stepReady').classList.remove('active');

  cart = {};
  closeSheet();
  renderMenu(); renderCartBar(); renderSlots();
  document.getElementById('ticketView').classList.add('show');

  setTimeout(()=>document.getElementById('stepCooking').classList.add('active'), 2500);
  setTimeout(()=>document.getElementById('stepReady').classList.add('active'), 5500);
};

document.getElementById('newOrderBtn').onclick = () => {
  document.getElementById('ticketView').classList.remove('show');
  selectedSlot = null;
  renderSlots();
};

renderSlots(); renderCats(); renderMenu(); renderCartBar();
</script>
</body>
</html>
